# Monorepo CI (ADR 0014): ONE workflow, a changes job (dorny/paths-filter),
# per-app jobs gated on its outputs, and the umbrella "Wait for CI" job that
# ALWAYS runs. Branch protection requires only "Wait for CI" — the one check
# guaranteed present on every PR — so a path-skipped app can never leave a
# required check pending.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs (ADR 0026): dispatch with push-image=true builds and
  # pushes the relay image's sha-<sha> tag from any branch whose image
  # inputs differ from main — the pre-merge/candidate path (the fleet
  # lane's bootstrap). `latest` still moves only on main merges.
  workflow_dispatch:
    inputs:
      push-image:
        description: "Push the relay image to GHCR (sha-<sha> only; latest moves only on main merges)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter lists changed PR files via the API

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      api: ${{ steps.filter.outputs.api }}
      cli: ${{ steps.filter.outputs.cli }}
      deny: ${{ steps.filter.outputs.deny }}
      machete: ${{ steps.filter.outputs.machete }}
      typos: ${{ steps.filter.outputs.typos }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # persist-credentials: false — later steps run no git-authenticated ops
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # pinned to commit — mutable tags execute unreviewed code
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            core:
              - "apps/core/**"
              - "scripts/ci/core.sh"
              - "scripts/ci/rust.sh"
              - "scripts/ci/mise-version.sh"
              - "clippy.toml" # float guard (ADR 0006) applies to every Rust package
              - "Cargo.toml"
              - "Cargo.lock"
              - "mise.toml"
              - "codecov.yml" # core flag's statuses — an edit must reach the upload that applies it
              - ".github/workflows/ci.yml"
            api:
              - "apps/api/**"
              - "apps/core/**" # core is shared: a core change re-runs every consumer
              - "Dockerfile" # the api image bakes this crate; its CI surface includes it
              - "scripts/ci/api.sh"
              - "scripts/ci/rust.sh"
              - "scripts/ci/mise-version.sh"
              - "clippy.toml"
              - "Cargo.toml"
              - "Cargo.lock"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            cli:
              - "apps/cli/**"
              - "apps/core/**" # core is shared: a core change re-runs every consumer
              - "scripts/ci/cli.sh"
              - "scripts/ci/rust.sh"
              - "scripts/ci/mise-version.sh"
              - "clippy.toml"
              - "Cargo.toml"
              - "Cargo.lock"
              - "mise.toml"
              - ".github/workflows/ci.yml"
            deny:
              - "apps/**" # the resolved tree is what the checks see
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"
              - "scripts/ci/deny.sh"
              - "scripts/ci/mise-version.sh"
              - "mise.toml" # cargo-deny version
              - ".github/workflows/ci.yml"
            machete:
              # source edits can orphan a dep without touching Cargo.lock,
              # so this gates on sources, not just manifests
              - "apps/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "scripts/ci/machete.sh"
              - "scripts/ci/mise-version.sh"
              - "mise.toml" # cargo-machete version
              - ".github/workflows/ci.yml"
            typos:
              # any file can hold a typo — typos.toml makes the action walk
              # hidden paths (.github/, dotfiles) too, so "**" is literal
              - "**"
            # the release-image job's inputs (ADR 0026): the image bakes
            # pursecraft-api + core and pins the toolchain mise names.
            # Deliberately a SUBSET of the api filter above — the job
            # needs api, so a path that trips docker must trip api too,
            # or a Dockerfile-only change could skip its own publish.
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "apps/api/**"
              - "apps/core/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "mise.toml"
              - ".github/workflows/ci.yml"

  core:
    name: Core CI
    needs: check-changes
    if: needs.check-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift (ADR 0014) — through
      # the one shared parser in scripts/ci/mise-version.sh.
      - name: Read tool versions from mise.toml
        id: versions
        run: |
          rust="$(scripts/ci/mise-version.sh rust)"
          llvm_cov="$(scripts/ci/mise-version.sh 'ubi:taiki-e/cargo-llvm-cov')"
          echo "rust=$rust llvm-cov=$llvm_cov"
          # separate tests: `a && b` does not fail the step when a is empty
          test -n "$rust"
          test -n "$llvm_cov"
          echo "rust=$rust" >>"$GITHUB_OUTPUT"
          echo "llvm_cov=$llvm_cov" >>"$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          # llvm-tools-preview: cargo-llvm-cov needs llvm-profdata (ADR 0020);
          # keep in sync with the components list in mise.toml
          components: rustfmt, clippy, llvm-tools-preview

      # Self-keyed cargo cache (parsed rust version + Cargo.lock). Never
      # cache ~/.rustup: a restored install marker without the toolchain
      # makes later runs skip the install and fail on missing components.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.versions.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.versions.outputs.rust }}-

      # install-action pinned to commit — mutable tags execute unreviewed
      # code. Version parsed from mise.toml above (ADR 0014).
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov@${{ steps.versions.outputs.llvm_cov }}

      - run: scripts/ci/core.sh

      # v7.1.1 — pinned to commit: mutable tags execute unreviewed code.
      # fail_ci_if_error is the silent-upload watchdog: a swallowed failure
      # must not look like passing CI with fresh coverage. Fork PRs have no
      # secret access (tokenless upload) — the watchdog stays armed wherever
      # the token is; a codecov.io outage reds this step on same-repo runs.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          flags: core
          files: target/coverage/core.lcov
          disable_search: true # files: is additive — without this the CLI
          # also globs for coverage files and could upload a stray match
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ !github.event.pull_request.head.repo.fork }}

  api:
    name: API CI
    needs: check-changes
    if: needs.check-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift (ADR 0014).
      - name: Read Rust version from mise.toml
        id: rust
        run: |
          version="$(scripts/ci/mise-version.sh rust)"
          echo "rust=$version"
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      # Self-keyed cargo cache (parsed rust version + Cargo.lock). Never
      # cache ~/.rustup: a restored install marker without the toolchain
      # makes later runs skip the install and fail on missing components.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.version }}-

      - run: scripts/ci/api.sh

  cli:
    name: CLI CI
    needs: check-changes
    if: needs.check-changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift (ADR 0014).
      - name: Read Rust version from mise.toml
        id: rust
        run: |
          version="$(scripts/ci/mise-version.sh rust)"
          echo "rust=$version"
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      # Self-keyed cargo cache (parsed rust version + Cargo.lock). Never
      # cache ~/.rustup: a restored install marker without the toolchain
      # makes later runs skip the install and fail on missing components.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.version }}-

      - run: scripts/ci/cli.sh

  deny:
    name: cargo-deny
    needs: check-changes
    if: needs.check-changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift (ADR 0014).
      - name: Read tool versions from mise.toml
        id: versions
        run: |
          deny="$(scripts/ci/mise-version.sh 'ubi:EmbarkStudios/cargo-deny')"
          rust="$(scripts/ci/mise-version.sh rust)"
          echo "deny=$deny rust=$rust"
          # separate tests: `a && b` does not fail the step when a is empty
          test -n "$deny"
          test -n "$rust"
          echo "deny=$deny" >>"$GITHUB_OUTPUT"
          echo "rust=$rust" >>"$GITHUB_OUTPUT"

      # cargo-deny shells out to `cargo metadata`, so a toolchain is needed
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.versions.outputs.rust }}

      # pinned to commit — mutable tags execute unreviewed code
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@${{ steps.versions.outputs.deny }}

      - run: scripts/ci/deny.sh

  machete:
    name: cargo-machete
    needs: check-changes
    if: needs.check-changes.outputs.machete == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for tool versions; parse
      # (not install) so CI and local dev can't drift (ADR 0014).
      - name: Read tool versions from mise.toml
        id: versions
        run: |
          machete="$(scripts/ci/mise-version.sh 'ubi:bnjbvr/cargo-machete')"
          rust="$(scripts/ci/mise-version.sh rust)"
          echo "machete=$machete rust=$rust"
          # separate tests: `a && b` does not fail the step when a is empty
          test -n "$machete"
          test -n "$rust"
          echo "machete=$machete" >>"$GITHUB_OUTPUT"
          echo "rust=$rust" >>"$GITHUB_OUTPUT"

      # cargo-machete --with-metadata resolves target/build deps, which needs
      # cargo — a missing toolchain would degrade the check to silent green.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.versions.outputs.rust }}

      # install-action pinned to commit — mutable tags execute unreviewed code
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-machete@${{ steps.versions.outputs.machete }}

      - run: scripts/ci/machete.sh

  typos:
    name: Typos
    needs: check-changes
    if: needs.check-changes.outputs.typos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # pinned to commit — mutable tags execute unreviewed code
      - uses: crate-ci/typos@9023c1f779400877cafdd98052113fc777e2cfdc # v1.51.1

  # Release image (ADR 0026): build and push the relay image once the
  # suite that vets the baked code is green. sha-<sha> + latest follow
  # the fleet's pattern (Flux image-automation follows latest,
  # digest-pinned); the package is public and nothing secret ships in it.
  # A manual dispatch with push-image pushes sha-<sha> ONLY — the
  # bootstrap/candidate path on any branch whose image inputs differ
  # from main; latest never moves off a merge. `needs: api` cannot be
  # skipped under this job's gate: the docker filter is a subset of the
  # api filter. A red wait-for-ci on main stops the operator before
  # pinning a broken digest, exactly as the deploy runbook expects.
  release-image:
    name: Release image
    needs: [check-changes, api]
    if: >-
      needs.check-changes.outputs.docker == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.push-image == true))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The builder pin must carry mise.toml's Rust (ADR 0014: one
      # version source) — assert instead of trusting the Dockerfile,
      # the same guard Thalmyra's BEAM pins carry.
      - name: Assert the builder image matches mise.toml's Rust pin
        run: |
          rust="$(scripts/ci/mise-version.sh rust)"
          image="$(sed -n 's/^ARG RUST_IMAGE=\(.*\)$/\1/p' Dockerfile | head -1)"
          echo "RUST_IMAGE=$image rust=$rust"
          test -n "$rust"
          test -n "$image"
          echo "$image" | grep -qF "rust:$rust-bookworm@sha256:" || {
            echo "::error::RUST_IMAGE ($image) does not match mise.toml (rust $rust) — bump the pins together"; exit 1; }

      - name: Compute image tags
        id: tags
        # latest moves only on main merges — the Thalmyra contract;
        # dispatches push the immutable sha tag alone
        run: |
          {
            echo "tags<<TAGS"
            echo "ghcr.io/fluxvale/pursecraft:sha-${{ github.sha }}"
            if [ "${{ github.event_name }}" = push ]; then
              echo "ghcr.io/fluxvale/pursecraft:latest"
            fi
            echo "TAGS"
          } >>"$GITHUB_OUTPUT"

      # pinned to commit — mutable tags execute unreviewed code; this
      # job holds packages:write
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pinned to commit — mutable tags execute unreviewed code; this
      # job holds packages:write
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.10.0

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=min
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |-
            REVISION=${{ github.sha }}

  # Adding a job (app or check) takes FOUR edits here, and skipping any one
  # of them removes the job from the required check silently (its job never
  # runs, or runs ungated): (a) add it to the changes filters above,
  # repeating the shared paths the existing filters carry; (b) export that
  # filter in check-changes.outputs above, or its job gate reads an empty
  # string; (c) add the job; (d) add that job to wait-for-ci.needs below.
  # New top-level files (say, a future compose.yaml) can match no cargo
  # filter — add them to every relevant filter when they land, or their
  # changes run nothing; the typos job filters on "**" (and walks hidden
  # paths via typos.toml) precisely so no file class escapes every check.
  #
  # The umbrella: branch protection requires THIS check. Runs regardless of
  # path gating; passes when every gated job succeeded or was skipped.
  # check-changes must SUCCEED, not merely skip: if it failed, its dependents
  # read "skipped" and the all() below would pass on zero checks run.
  wait-for-ci:
    name: Wait for CI
    needs: [check-changes, core, api, cli, deny, machete, typos, release-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -er 'to_entries | map("\(.key): \(.value.result)") | .[]' >&2
          if echo "$NEEDS" | jq -e '.["check-changes"].result == "success" and (del(.["check-changes"]) | all(.[]; .result == "success" or .result == "skipped"))' >/dev/null; then
            echo "All CI checks passed or were not needed"
          else
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
