[workspace]
resolver = "3"
members = ["apps/core/crates/*", "apps/api", "apps/cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
# ADR 0019: the product is FSL-1.1-ALv2 source-available. Declaring it here
# puts every workspace crate through deny.toml's license check like any dep.
license = "FSL-1.1-ALv2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
