# cargo-deny config for scripts/ci/deny.sh and the CI "cargo-deny" job
# (issue #12): `cargo-deny --locked check advisories licenses` runs against
# the whole workspace tree. Vulnerabilities, unmaintained crates, and yanked
# versions all FAIL by configuration below — cargo-deny's stock defaults are
# not all deny (yanked defaults to warn), so deviations are spelled out.

[advisories]
# A yanked release in Cargo.lock is a withdrawn, unsupported release — deny it
# (stock default is warn; a money app does not ship withdrawn deps).
yanked = "deny"
# RustSec advisories with a fix demand an upgrade; an ignore is a documented,
# temporary exception — every entry needs a reason and a removal plan.
ignore = [
    #{ id = "RUSTSEC-0000-0000", reason = "..." },
]

[licenses]
# Allow-list of licenses. "MIT", "Apache-2.0" are the Rust ecosystem's two
# defaults; "Unicode-3.0" rides along with unicode-ident ("(MIT OR Apache-2.0)
# AND Unicode-3.0"); "FSL-1.1-ALv2" is this workspace's own license
# (ADR 0019), declared via workspace.package.license so our crates are checked
# exactly like dependencies. Adding anything else to this list is a deliberate
# decision (memchr's "Unlicense OR MIT" is satisfied by MIT; Unlicense itself
# stays un-allowed).
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "FSL-1.1-ALv2",
    # The dalek family (x25519-dalek → curve25519-dalek → subtle) is
    # triple-licensed "MIT OR Apache-2.0 OR BSD-3-Clause"; the crypto
    # lane's device-key wrapping pulled it in (ADR 0022). OSI/FSF-free.
    # Note this allow list is global and descriptive of today's tree:
    # any future BSD-3-Clause dep is admitted identically — adding one
    # is a supply-chain decision to make consciously, not silently.
    "BSD-3-Clause",
    # Originally added for minreq 2.14 (ADR 0025, since replaced by ureq,
    # ADR 0029); still load-bearing: rustls-webpki and untrusted (via
    # ureq's rustls feature) are ISC too.
    "ISC",
    # webpki-roots 1.x (Mozilla's CA bundle, via ureq's rustls feature,
    # ADR 0029) ships its certificate DATA under CDLA-Permissive-2.0 —
    # a permissive data license (use, distribute, modify; share-alike
    # applies to the data itself only, no source disclosure).
    "CDLA-Permissive-2.0",
]
