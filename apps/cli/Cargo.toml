[package]
name = "pursecraft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pursecraft-core = { path = "../core/crates/pursecraft-core" }
# The E2EE adapter (ADR 0022) the CLI installs (ADR 0028): envelope sealing,
# device keys, and the key records the relay carries. Crypto lives here, not
# in core or the relay — the dependency points one way (ADR 0001's adapters).
pursecraft-crypto = { path = "../core/crates/pursecraft-crypto" }
# Id minting only (`from_u128`/bit inspection): v7 ids are minted in this
# crate (ADR 0023) from the clock plus /dev/urandom, so no `rng` feature —
# the `rand` tree stays out of the lockfile (cargo-deny/machete lean).
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local civil date for the `today` default (ADR 0023): std-only — pulls just
# jiff-core on unix. License `Unlicense OR MIT`, satisfied by deny.toml's MIT.
jiff = { version = "0.2", default-features = false, features = ["std"] }
# The relay's HTTP client (ADR 0029 replaces ADR 0025's minreq): ureq 3,
# minimal cut — rustls TLS (ring provider; no aws-lc-rs, no cmake) and
# JSON, no url/ICU tree (that is ureq's optional cookies feature, off).
# minreq's own TLS features pin an unfixably vulnerable rustls 0.21 stack
# (7 live RustSec advisories, measured Oct 2026); ureq ships rustls 0.23.
# The agent is built strict: no redirects, no status-as-error, 30s cap.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# The hidden enrollment-secret prompt (ADR 0030): reads one line with echo
# off. Apache-2.0 (deny.toml already allows it); adds only itself and its
# sibling rtoolbox to the unix tree (libc already ships via ring).
rpassword = "7.5"

[dev-dependencies]
# Integration tests (ADR 0025) drive the real relay router over a real
# localhost socket: the axum server the CLI's ureq client talks to.
pursecraft-api = { path = "../api" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
uuid = { version = "1", features = ["v4"] }
# The https round-trip test (ADR 0029): serve the real axum router over
# TLS with a fresh rcgen-minted self-signed certificate, trusted by the
# client through a test-only ureq agent (RootCerts::Specific).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "pursecraft"
path = "src/main.rs"

[lints]
workspace = true
