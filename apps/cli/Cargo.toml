[package]
name = "pursecraft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pursecraft-core = { path = "../core/crates/pursecraft-core" }
# Id minting only (`from_u128`/bit inspection): v7 ids are minted in this
# crate (ADR 0023) from the clock plus /dev/urandom, so no `rng` feature —
# the `rand` tree stays out of the lockfile (cargo-deny/machete lean).
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local civil date for the `today` default (ADR 0023): std-only — pulls just
# jiff-core on unix. License `Unlicense OR MIT`, satisfied by deny.toml's MIT.
jiff = { version = "0.2", default-features = false, features = ["std"] }

[[bin]]
name = "pursecraft"
path = "src/main.rs"

[lints]
workspace = true
